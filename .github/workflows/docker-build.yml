---
name: Build and Push Docker Image

on:
  # Allows you to run workflow manually from Actions tab
  workflow_dispatch:
    inputs:
      tags:
        description: 'Docker Tag'
        required: true
        default: 'latest'
  push:
    branches: [main, master, homelab-postgres]
    tags:
      - 'v*.*.*'
    # Only build when files in these directories have been changed
    paths:
      - client/**
      - server/**
      - index.js
      - package.json
      - package-lock.json
      - tsconfig.server.json
      - Dockerfile
      - .github/workflows/docker-build.yml

# github.token pushes to GHCR. The package permission is required for that.
permissions:
  contents: read
  packages: write

jobs:
  build:
    # Upstream builds publish to Docker Hub and GHCR. Fork builds publish to GHCR only.
    # The fork name is hard-coded here: renaming the repository disables its builds.
    if: ${{ !contains(github.event.head_commit.message, 'skip ci') && (github.repository == 'advplyr/audiobookshelf' || github.repository == 'kevingatera/audiobookshelf') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Docker meta (upstream)
        if: ${{ github.repository == 'advplyr/audiobookshelf' }}
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: advplyr/audiobookshelf,ghcr.io/${{ github.repository_owner }}/audiobookshelf
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}

      - name: Docker meta (fork)
        if: ${{ github.repository != 'advplyr/audiobookshelf' }}
        id: meta-fork
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/audiobookshelf
          tags: |
            type=edge,branch=master
            type=semver,pattern={{version}}
            type=raw,value=homelab-postgres,enable=${{ github.ref == 'refs/heads/homelab-postgres' }}
            type=raw,value=homelab-postgres-${{ github.sha }},enable=${{ github.ref == 'refs/heads/homelab-postgres' }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Dockerhub
        if: ${{ github.repository == 'advplyr/audiobookshelf' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          # Manual runs take a tag suffix. Build the full GHCR reference from it, so a default of "latest" never resolves to Docker Hub.
          tags: ${{ github.event_name == 'workflow_dispatch' && format('ghcr.io/{0}/audiobookshelf:{1}', github.repository_owner, github.event.inputs.tags) || (github.repository == 'advplyr/audiobookshelf' && steps.meta.outputs.tags || steps.meta-fork.outputs.tags) }}
          labels: ${{ github.repository == 'advplyr/audiobookshelf' && steps.meta.outputs.labels || steps.meta-fork.outputs.labels }}
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
